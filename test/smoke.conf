# Конфиг для дымового теста собранного образа.
# Не используется в бою: здесь namespace /tmp и SecRuleEngine On,
# чтобы проверить блокировку, а не только загрузку модуля.
load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

events {}
error_log /dev/stderr info;
pid /tmp/nginx.pid;

http {
    access_log off;
    client_body_temp_path /tmp/cb;
    proxy_temp_path /tmp/pt;
    fastcgi_temp_path /tmp/ft;
    uwsgi_temp_path /tmp/ut;
    scgi_temp_path /tmp/st;

    modsecurity on;
    modsecurity_rules_file /tmp/smoke-rules.conf;

    server {
        listen 8081;

        # Именно отдача файла, а не `return 200`: return обрабатывается
        # на фазе rewrite, которая идёт РАНЬШЕ preaccess, где подключается
        # ModSecurity. С `return` запрос завершается до проверки правил,
        # и тест показывает 200 на любую атаку.
        root /tmp/www;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
