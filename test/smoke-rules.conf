# Набор правил для дымового теста.
#
# Повторяет боевой main.conf, но переводит движок в блокирующий режим.
# SecRuleEngine стоит ПОСЛЕ всех Include намеренно: у ModSecurity выигрывает
# последнее вхождение директивы. Полагаться на директиву modsecurity_rules
# рядом с modsecurity_rules_file нельзя — порядок слияния не гарантирован.

Include /etc/modsecurity.d/modsecurity.conf
Include /opt/owasp-crs/crs-setup.conf

Include /etc/modsecurity.d/custom/before/*.conf
Include /opt/owasp-crs/rules/*.conf
Include /etc/modsecurity.d/custom/after/*.conf

SecRuleEngine On
