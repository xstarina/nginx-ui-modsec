# Порядок важен: исключения "before" должны идти после crs-setup,
# но до правил CRS; "after" — после всех правил.

Include /etc/modsecurity.d/modsecurity.conf
Include /opt/owasp-crs/crs-setup.conf

Include /etc/modsecurity.d/custom/before/*.conf
Include /opt/owasp-crs/rules/*.conf
Include /etc/modsecurity.d/custom/after/*.conf
